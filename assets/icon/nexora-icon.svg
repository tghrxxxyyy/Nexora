  <path d="M197 661C292 827 508 886 690 793C839 718 902 560 839 402" fill="none" stroke="url(#orbit)" stroke-linecap="round" stroke-width="9"/>
  <path d="M236 357C339 190 554 139 737 228C781 250 820 282 851 323" fill="none" stroke="#C2F4FF" stroke-opacity=".24" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="661" r="31" fill="#76E9FF" filter="url(#softGlow)"/>
  <circle cx="200" cy="661" r="15" fill="#E8FDFF"/>
  <circle cx="839" cy="402" r="27" fill="#F3A5DF" filter="url(#softGlow)"/>
  <circle cx="839" cy="402" r="12" fill="url(#spark)"/>
  <circle cx="851" cy="323" r="9" fill="#B8EBFF"/>
  <circle cx="737" cy="228" r="7" fill="#EDC4FF"/>
