    </filter>
    <filter id="letterGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#ground)"/>
  <rect x="22" y="22" width="980" height="980" rx="204" fill="none" stroke="#BEEBFF" stroke-opacity=".12" stroke-width="4"/>
  <circle cx="512" cy="507" r="406" fill="url(#aura)"/>
