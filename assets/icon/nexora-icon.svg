<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nexora app icon</title>
  <desc id="desc">A luminous N set within an orbital connection field.</desc>
  <defs>
    <linearGradient id="ground" x1="118" y1="74" x2="906" y2="951" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C3B"/>
      <stop offset="0.48" stop-color="#172D58"/>
      <stop offset="1" stop-color="#4B215B"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(475 461) rotate(54) scale(505 481)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#88D9FF" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#6274FF" stop-opacity=".11"/>
      <stop offset="1" stop-color="#F071C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="193" y1="757" x2="838" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71EDFF" stop-opacity=".3"/>
      <stop offset=".45" stop-color="#D9F7FF" stop-opacity=".94"/>
      <stop offset="1" stop-color="#D697FF" stop-opacity=".36"/>
    </linearGradient>
    <linearGradient id="letter" x1="343" y1="253" x2="700" y2="771" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FEFF"/>
      <stop offset=".42" stop-color="#9BEFFF"/>
      <stop offset=".76" stop-color="#8FA4FF"/>
      <stop offset="1" stop-color="#F4A8E0"/>
    </linearGradient>
    <linearGradient id="spark" x1="698" y1="289" x2="809" y2="430" gradientUnits="userSpaceOnUse">
