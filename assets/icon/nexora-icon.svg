  <path d="M340 737V294C340 269 370 258 385 279L642 632V290" fill="none" stroke="url(#letter)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M392 337L600 622" fill="none" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="7" stroke-linecap="round"/>
